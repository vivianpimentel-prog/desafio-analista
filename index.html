<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Desafio Analista • Quiz Contábil</title><style>
:root{--neon:#18dcff;--navy:#06152f;--deep:#020713;--white:#f5fbff;--muted:#9db9cf;--ok:#36f5a2;--bad:#ff5577;--gold:#ffd65a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--white);background:radial-gradient(circle at 15% 15%,#18356f 0,transparent 28%),radial-gradient(circle at 85% 5%,#351756 0,transparent 25%),linear-gradient(145deg,#000,#010819 50%,#000);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px),radial-gradient(circle,var(--neon) 0 1px,transparent 1.5px);background-size:73px 73px,139px 139px;background-position:8px 18px,43px 64px;opacity:.43}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:28px 0 46px}header{text-align:center;position:relative;padding:28px 8px}.sat{position:absolute;right:5%;top:0;font-size:50px;filter:drop-shadow(0 0 10px var(--neon));animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-9px) rotate(7deg)}}h1{font-size:clamp(2rem,5vw,3.8rem);margin:8px 0;color:#fff;text-shadow:0 0 22px #25cbff;letter-spacing:.05em}header p{color:#91eaff}.screen{display:none}.screen.active{display:block}.box{background:rgba(3,16,38,.88);border:1px solid #19dcff6b;border-radius:20px;padding:clamp(18px,4vw,34px);box-shadow:0 0 28px #00bfff1b,0 20px 50px #0008;backdrop-filter:blur(8px)}label{display:block;color:#bfeeff;margin:0 0 8px;font-weight:700}input,select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #19dcff77;background:#03142d;color:white;font-size:1rem;outline:none}input:focus,select:focus{box-shadow:0 0 14px #19dcff66;border-color:var(--neon)}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.btn{border:1px solid var(--neon);background:#071d3d;color:var(--neon);padding:12px 18px;border-radius:11px;font-weight:800;cursor:pointer;transition:.2s}.btn:hover:not(:disabled){background:var(--neon);color:#00141b;box-shadow:0 0 18px #19dcff91;transform:translateY(-1px)}.btn:disabled{opacity:.38;cursor:not-allowed}.primary{width:100%;font-size:1rem}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.badge{border:1px solid #19dcff66;border-radius:20px;padding:7px 11px;color:var(--neon);font-size:.8rem}.progress-track{height:8px;background:#07162c;border-radius:10px;overflow:hidden;margin:14px 0 24px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#148cff,var(--neon));box-shadow:0 0 12px var(--neon);transition:.35s}.question{font-size:clamp(1.25rem,3vw,1.65rem);line-height:1.4;margin:12px 0 22px}.options{display:grid;gap:11px}.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border:1px solid #24507a;border-radius:13px;background:#06172f;color:#e9f7ff;cursor:pointer;font-size:.98rem;line-height:1.35}.option:hover:not(:disabled){border-color:var(--neon);background:#082044}.option.selected{border-color:var(--neon);box-shadow:0 0 14px #19dcff48;background:#0a2850}.option.correct{border-color:var(--ok);background:#073d32;color:#eafff7}.option.wrong{border-color:var(--bad);background:#481326;color:#fff0f4}.letter{min-width:28px;height:28px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;font-weight:900}.answer-panel{display:none;margin-top:18px;padding:16px;border-radius:13px;background:#071a34;border-left:4px solid var(--neon);line-height:1.55}.answer-panel.show{display:block}.answer-panel.ok{border-color:var(--ok)}.answer-panel.bad{border-color:var(--bad)}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.score-big{text-align:center;font-size:clamp(2.5rem,8vw,5.5rem);color:var(--neon);font-weight:900;text-shadow:0 0 20px #19dcff88;margin:8px}.result-summary{text-align:center;color:#cfe8f7}.ranking{margin-top:25px}.rank-item{display:grid;grid-template-columns:42px 1fr auto auto;gap:11px;align-items:center;padding:12px 10px;border-bottom:1px solid #1a3856}.pos{font-weight:900;color:var(--gold);font-size:1.15rem}.rank-name{font-weight:800}.rank-meta{color:var(--muted);font-size:.8rem}.rank-score{color:var(--neon);font-weight:900}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.small{font-size:.78rem;color:var(--muted);line-height:1.5}.hidden-answer{margin-top:18px;padding:13px;text-align:center;color:#7892a8;border:1px dashed #254765;border-radius:12px}.actions-end{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}@media(max-width:600px){.row{grid-template-columns:1fr}.rank-item{grid-template-columns:36px 1fr auto}.rank-meta{display:none}.controls{flex-direction:column}.controls .btn{width:100%}.sat{right:0}}
</style></head><body><main class="wrap"><header><div class="sat">🛰️</div><h1>DESAFIO ANALISTA</h1><p>Simulado interativo • Analista Contábil</p></header>
<section id="start" class="screen active"><div class="box"><h2>Iniciar tentativa</h2><p class="small">A resposta só será exibida depois que você selecionar uma alternativa e clicar em <strong>Responder</strong>. O ranking fica salvo neste navegador.</p><div class="row"><div><label for="name">Nome no ranking</label><input id="name" maxlength="30" placeholder="Digite seu nome"></div><div><label for="amount">Quantidade de questões</label><select id="amount"><option value="10">10 questões</option><option value="20">20 questões</option><option value="30">30 questões</option><option value="38">Todas as 38 questões</option></select></div></div><div><label for="category">Tema</label><select id="category"><option value="TODOS">Todos os temas</option><option>EDITAL</option><option>PORTUGUÊS</option><option>CONTABILIDADE</option><option>CONCILIAÇÃO</option><option>TRIBUTOS</option><option>REFORMA</option></select></div><br><button class="btn primary" id="begin">INICIAR SIMULADO</button><div class="ranking" id="startRanking"></div></div></section>
<section id="quiz" class="screen"><div class="box"><div class="topbar"><span class="badge" id="cat"></span><strong id="counter"></strong><span class="badge" id="liveScore"></span></div><div class="progress-track"><div class="progress-fill" id="bar"></div></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div id="locked" class="hidden-answer">🔒 A resposta será liberada somente após você responder.</div><div class="answer-panel" id="answer"></div><div class="controls"><button class="btn" id="respond" disabled>RESPONDER</button><button class="btn" id="next" style="display:none">PRÓXIMA QUESTÃO</button></div></div></section>
<section id="result" class="screen"><div class="box"><h2 style="text-align:center">Resultado da missão</h2><div class="score-big" id="finalPct"></div><p class="result-summary" id="summary"></p><div class="ranking" id="finalRanking"></div><div class="actions-end"><button class="btn" id="again">NOVA TENTATIVA</button><button class="btn" id="clearRank">LIMPAR RANKING</button></div></div></section></main>
<script>const QUESTIONS=[{"cat": "EDITAL", "q": "Qual é o peso da prova objetiva na média final?", "o": ["4", "5", "6", "10"], "a": 2, "e": "A prova objetiva possui peso 6; a entrevista possui peso 4."}, {"cat": "EDITAL", "q": "Para não ser eliminado na prova, o candidato deve:", "o": ["Obter ao menos 50% do total e não zerar nenhuma área", "Obter nota 6 em cada disciplina", "Acertar todas as questões específicas", "Obter nota maior que a entrevista"], "a": 0, "e": "O edital exige pelo menos 50% da pontuação total e nota diferente de zero em cada área de conhecimento."}, {"cat": "EDITAL", "q": "Quantos candidatos são convocados inicialmente para a entrevista?", "o": ["5", "8", "10", "15"], "a": 2, "e": "São convocados os 10 primeiros classificados na prova, incluindo empatados na 10ª posição."}, {"cat": "EDITAL", "q": "Qual é a média mínima final para aprovação?", "o": ["5,0", "6,0", "7,0", "8,0"], "a": 1, "e": "A média ponderada final deve ser igual ou superior a 6,0."}, {"cat": "EDITAL", "q": "Qual é a ordem dos critérios de desempate?", "o": ["Idade, prova e entrevista", "Prova, entrevista e idade", "Entrevista, prova e idade", "Entrevista, idade e prova"], "a": 2, "e": "A ordem é: maior nota na entrevista, maior nota na prova objetiva e maior idade."}, {"cat": "EDITAL", "q": "A validade do processo seletivo é de:", "o": ["6 meses", "12 meses", "18 meses", "24 meses"], "a": 3, "e": "O processo seletivo terá validade de 24 meses a partir da publicação do resultado final."}, {"cat": "EDITAL", "q": "Qual experiência mínima é exigida?", "o": ["3 meses", "6 meses", "1 ano", "2 anos"], "a": 1, "e": "São exigidos 6 meses de experiência comprovada na área Contábil ou Fiscal."}, {"cat": "EDITAL", "q": "Qual competência NÃO aparece entre as sete avaliadas na entrevista?", "o": ["Visão sistêmica", "Solução de problemas", "Trabalho em equipe", "Fluência em inglês"], "a": 3, "e": "Fluência em inglês não integra a lista de sete qualificações da entrevista."}, {"cat": "PORTUGUÊS", "q": "Em 'A empresa abriu as portas para novas ideias', a expressão destacada está em sentido:", "o": ["Denotativo", "Conotativo", "Técnico", "Jurídico"], "a": 1, "e": "'Abriu as portas' representa acolhimento ou oportunidade, portanto está em sentido figurado ou conotativo."}, {"cat": "PORTUGUÊS", "q": "Assinale o par de palavras parônimas:", "o": ["Mau e bom", "Descrição e discrição", "Casa e lar", "Banco e banco"], "a": 1, "e": "Descrição e discrição possuem grafia e pronúncia semelhantes, mas significados diferentes."}, {"cat": "PORTUGUÊS", "q": "Assinale a frase com concordância verbal correta:", "o": ["Houveram inconsistências nos lançamentos.", "Fazem dois meses que ocorreu o ajuste.", "Existem diferenças a conciliar.", "Deve haverem documentos pendentes."], "a": 2, "e": "O verbo existir concorda com 'diferenças'. Haver e fazer, nos sentidos apresentados, são impessoais."}, {"cat": "PORTUGUÊS", "q": "Em qual frase o uso da crase está correto?", "o": ["O relatório foi entregue à diretoria.", "O analista ficou frente à frente com o problema.", "A equipe começou à revisar os dados.", "O pagamento será feito à prazo."], "a": 0, "e": "Há fusão da preposição 'a', exigida por 'entregue', com o artigo feminino antes de 'diretoria'."}, {"cat": "PORTUGUÊS", "q": "Assinale a opção com pontuação adequada:", "o": ["Após a conciliação os saldos, foram ajustados.", "Após a conciliação, os saldos foram ajustados.", "Após, a conciliação os saldos foram ajustados.", "Após a conciliação os saldos foram, ajustados."], "a": 1, "e": "A expressão adverbial deslocada 'Após a conciliação' pode ser separada por vírgula."}, {"cat": "PORTUGUÊS", "q": "Na frase 'Embora houvesse divergências, o balancete foi concluído', a relação é de:", "o": ["Causa", "Concessão", "Conclusão", "Explicação"], "a": 1, "e": "A conjunção 'embora' introduz uma oração subordinada adverbial concessiva."}, {"cat": "PORTUGUÊS", "q": "Qual alternativa apresenta sinonímia?", "o": ["Débito e crédito", "Claro e escuro", "Iniciar e começar", "Sessão e seção"], "a": 2, "e": "Iniciar e começar possuem sentidos equivalentes no contexto geral."}, {"cat": "CONTABILIDADE", "q": "Qual é a equação patrimonial básica?", "o": ["Ativo = Receita + Despesa", "Ativo = Passivo + Patrimônio Líquido", "Passivo = Ativo + Receita", "Patrimônio Líquido = Ativo + Passivo"], "a": 1, "e": "Os recursos controlados pela entidade são financiados por obrigações e capital próprio."}, {"cat": "CONTABILIDADE", "q": "A compra de um equipamento à vista provoca:", "o": ["Aumento do Ativo e do Passivo", "Redução do Ativo e do PL", "Troca entre elementos do Ativo", "Aumento da receita"], "a": 2, "e": "O equipamento aumenta e o caixa diminui no mesmo valor, sem alterar o total do Ativo."}, {"cat": "CONTABILIDADE", "q": "As contas do Ativo possuem, normalmente, natureza:", "o": ["Credora", "Devedora", "Nula", "Mista"], "a": 1, "e": "Contas do Ativo aumentam por débito e diminuem por crédito."}, {"cat": "CONTABILIDADE", "q": "As receitas possuem, normalmente, natureza:", "o": ["Devedora", "Credora", "Patrimonial", "Compensatória"], "a": 1, "e": "Receitas normalmente aumentam por crédito e contribuem positivamente para o resultado."}, {"cat": "CONTABILIDADE", "q": "O método das partidas dobradas estabelece que:", "o": ["Cada fato possui apenas um registro", "Todo débito tem crédito de igual valor", "Ativo e Passivo sempre aumentam juntos", "Toda despesa gera pagamento imediato"], "a": 1, "e": "A soma dos débitos deve ser igual à soma dos créditos em cada lançamento."}, {"cat": "CONTABILIDADE", "q": "O balancete de verificação serve principalmente para:", "o": ["Substituir o Balanço Patrimonial", "Verificar a igualdade entre débitos e créditos", "Calcular apenas tributos", "Comprovar ausência de qualquer erro"], "a": 1, "e": "O balancete verifica o equilíbrio contábil, mas não detecta todos os tipos de erro."}, {"cat": "CONTABILIDADE", "q": "A DRE evidencia:", "o": ["A posição patrimonial em uma data", "Receitas, custos, despesas e resultado do período", "Somente entradas e saídas bancárias", "Apenas contas do Ativo"], "a": 1, "e": "A Demonstração do Resultado evidencia o desempenho econômico em determinado período."}, {"cat": "CONTABILIDADE", "q": "Pelo regime de competência, uma despesa é reconhecida:", "o": ["Somente quando paga", "Quando ocorre o fato gerador econômico", "Quando houver saldo bancário", "Apenas ao fim do exercício"], "a": 1, "e": "O reconhecimento ocorre no período ao qual a despesa pertence, independentemente do pagamento."}, {"cat": "CONTABILIDADE", "q": "Qual demonstração apresenta Ativo, Passivo e Patrimônio Líquido?", "o": ["DRE", "DFC", "Balanço Patrimonial", "DMPL"], "a": 2, "e": "O Balanço Patrimonial evidencia a posição patrimonial e financeira em determinada data."}, {"cat": "CONCILIAÇÃO", "q": "O objetivo central da conciliação contábil é:", "o": ["Aumentar o saldo das contas", "Comparar registros com evidências e identificar divergências", "Eliminar documentos antigos", "Substituir a escrituração"], "a": 1, "e": "A conciliação valida saldos e movimentações por meio de documentos e controles auxiliares."}, {"cat": "CONCILIAÇÃO", "q": "Uma tarifa aparece no extrato bancário, mas não na contabilidade. O procedimento adequado é:", "o": ["Ignorar por ser valor bancário", "Apagar a linha do extrato", "Verificar o documento e registrar o ajuste cabível", "Alterar o extrato"], "a": 2, "e": "A divergência deve ser comprovada, registrada e documentada na contabilidade."}, {"cat": "CONCILIAÇÃO", "q": "Contas patrimoniais são aquelas que:", "o": ["São encerradas mensalmente sem saldo", "Representam Ativo, Passivo e PL", "Registram apenas receitas", "Não aparecem no Balanço"], "a": 1, "e": "As contas patrimoniais integram o Balanço e transferem seus saldos aos períodos seguintes."}, {"cat": "CONCILIAÇÃO", "q": "Após identificar uma inconsistência, o analista deve primeiro:", "o": ["Ajustar sem evidência", "Identificar a origem e reunir suporte documental", "Excluir o lançamento", "Transferir o saldo para despesa"], "a": 1, "e": "A correção deve ser sustentada pela causa identificada e por evidências adequadas."}, {"cat": "TRIBUTOS", "q": "Retenção na fonte ocorre quando:", "o": ["O prestador deixa de emitir documento", "O pagador desconta e recolhe o tributo conforme a lei", "Todo tributo é pago antecipadamente", "O município cancela o imposto"], "a": 1, "e": "Na retenção, a responsabilidade pelo desconto e recolhimento é atribuída ao pagador pela legislação."}, {"cat": "TRIBUTOS", "q": "Quais retenções federais são expressamente citadas no conteúdo do edital?", "o": ["IRRF, CSLL, PIS/COFINS e INSS", "ISS, ICMS e IPTU", "IPVA, ITR e ITBI", "Somente IRRF"], "a": 0, "e": "O edital cita IRRF, CSLL, PIS/COFINS e INSS."}, {"cat": "TRIBUTOS", "q": "Antes de aplicar uma retenção, é indispensável analisar:", "o": ["Apenas o valor da nota", "Natureza do serviço, partes, base, alíquota e hipóteses legais", "Somente o município do tomador", "A preferência do prestador"], "a": 1, "e": "A retenção depende do enquadramento completo da operação e da legislação aplicável."}, {"cat": "TRIBUTOS", "q": "Obrigação acessória é:", "o": ["Somente o pagamento do tributo", "Dever de declarar, escriturar ou prestar informações ao Fisco", "Uma despesa facultativa", "Um tributo municipal"], "a": 1, "e": "Obrigações acessórias são deveres instrumentais, inclusive quando não há imposto a pagar."}, {"cat": "TRIBUTOS", "q": "Na substituição tributária, a lei:", "o": ["Extingue o tributo", "Atribui a terceiro a responsabilidade pelo recolhimento", "Proíbe créditos fiscais", "Transforma imposto em taxa"], "a": 1, "e": "A responsabilidade tributária é deslocada para terceiro definido em lei."}, {"cat": "TRIBUTOS", "q": "Qual item é relevante na revisão de uma obrigação acessória?", "o": ["Somente o nome do arquivo", "Completude, cadastros, bases, valores, cruzamentos e prazo", "A cor do relatório", "A quantidade de páginas impressas"], "a": 1, "e": "A revisão técnica deve avaliar consistência, integralidade e tempestividade das informações."}, {"cat": "REFORMA", "q": "Quais são os principais tributos do modelo de IVA dual da reforma do consumo?", "o": ["ICMS e ISS", "CBS e IBS", "IRPJ e CSLL", "IPI e IOF"], "a": 1, "e": "O modelo de IVA dual é formado pela CBS federal e pelo IBS compartilhado entre entes subnacionais."}, {"cat": "REFORMA", "q": "Tributação no destino significa que a arrecadação tende a pertencer:", "o": ["Ao local de produção", "Ao local de consumo", "À matriz do fornecedor", "Ao banco arrecadador"], "a": 1, "e": "O princípio do destino direciona a tributação ao local onde ocorre o consumo."}, {"cat": "REFORMA", "q": "A não cumulatividade busca:", "o": ["Acumular tributo em cada etapa", "Evitar incidência acumulada por meio de créditos", "Eliminar documentos fiscais", "Tributar apenas exportações"], "a": 1, "e": "O sistema de créditos busca impedir que o tributo se acumule ao longo da cadeia."}, {"cat": "REFORMA", "q": "O Imposto Seletivo possui função geral de incidir sobre:", "o": ["Toda folha de pagamento", "Bens e serviços prejudiciais à saúde ou ao meio ambiente", "Somente serviços contábeis", "Apenas exportações"], "a": 1, "e": "O Imposto Seletivo tem caráter extrafiscal sobre bens e serviços definidos em lei."}];let quiz=[],idx=0,selected=null,correct=0,answered=false,player='';const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo({top:0,behavior:'smooth'})}function ranks(){try{return JSON.parse(localStorage.getItem('rankingDesafioAnalista')||'[]')}catch{return[]}}function saveRank(item){let r=ranks();r.push(item);r.sort((a,b)=>b.pct-a.pct||b.correct-a.correct||a.time-b.time);localStorage.setItem('rankingDesafioAnalista',JSON.stringify(r.slice(0,10)))}function rankHTML(){let r=ranks();return `<h3>🏆 Ranking de acertos</h3>${r.length?r.map((x,i)=>`<div class="rank-item"><span class="pos">${i+1}º</span><div><div class="rank-name">${escapeHtml(x.name)}</div><div class="rank-meta">${x.date} • ${x.total} questões</div></div><span>${x.correct}/${x.total}</span><span class="rank-score">${x.pct}%</span></div>`).join(''):'<p class="small">Nenhuma tentativa registrada ainda.</p>'}`}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function updateRanks(){$('startRanking').innerHTML=rankHTML();$('finalRanking').innerHTML=rankHTML()}function render(){let q=quiz[idx];selected=null;answered=false;$('cat').textContent=q.cat;$('counter').textContent=`Questão ${idx+1} de ${quiz.length}`;$('liveScore').textContent=`Acertos: ${correct}`;$('bar').style.width=`${idx/quiz.length*100}%`;$('question').textContent=q.q;$('options').innerHTML=q.o.map((o,i)=>`<button class="option" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=Number(b.dataset.i);$('respond').disabled=false});$('respond').style.display='block';$('respond').disabled=true;$('next').style.display='none';$('answer').className='answer-panel';$('answer').innerHTML='';$('locked').style.display='block'}$('respond').onclick=()=>{if(selected===null||answered)return;answered=true;let q=quiz[idx],ok=selected===q.a;if(ok)correct++;document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===selected&&!ok)b.classList.add('wrong')});$('locked').style.display='none';$('answer').className=`answer-panel show ${ok?'ok':'bad'}`;$('answer').innerHTML=`<strong>${ok?'✅ Resposta correta!':'❌ Resposta incorreta.'}</strong><br><strong>Alternativa correta: ${String.fromCharCode(65+q.a)}</strong><br>${q.e}`;$('respond').style.display='none';$('next').style.display='block';$('next').textContent=idx===quiz.length-1?'VER RESULTADO':'PRÓXIMA QUESTÃO';$('liveScore').textContent=`Acertos: ${correct}`};$('next').onclick=()=>{if(idx<quiz.length-1){idx++;render()}else finish()};function finish(){let pct=Math.round(correct/quiz.length*100);saveRank({name:player,correct,total:quiz.length,pct,date:new Date().toLocaleDateString('pt-BR'),time:Date.now()});$('finalPct').textContent=`${pct}%`;$('summary').textContent=`${player}, você acertou ${correct} de ${quiz.length} questões.`;updateRanks();screen('result')}$('begin').onclick=()=>{player=$('name').value.trim();if(!player){$('name').focus();$('name').style.borderColor='var(--bad)';return}let cat=$('category').value,pool=cat==='TODOS'?QUESTIONS:QUESTIONS.filter(x=>x.cat===cat),n=Math.min(Number($('amount').value),pool.length);quiz=shuffle(pool).slice(0,n);idx=0;correct=0;screen('quiz');render()};$('again').onclick=()=>screen('start');$('clearRank').onclick=()=>{if(confirm('Deseja apagar o ranking salvo neste navegador?')){localStorage.removeItem('rankingDesafioAnalista');updateRanks()}};updateRanks();</script></body></html>
